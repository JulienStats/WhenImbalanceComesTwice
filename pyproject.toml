[project]
name = "code-icpr"
version = "0.1.0"
description = "This is the code required to reproduce the experiments and results described in the paper When Imbalance Comes Twice: Active Learning under Simulated Class Imbalance and Label Shift in Binary Semantic Segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "albumentationsx>=2.0.13",
    "faiss-gpu>=1.7.2",
    "lightning==2.5.0",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.12.0.88",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.20.0",
    "torchmetrics==1.7.0",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
]
